[project]
name = "ill-bridge-ui"
version = "0.1.4"
description = "Admin and Libris portals for the ILL bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui==3.16.0",
    "httpx2>=0.28",
    "pydantic-settings>=2.5",
]

[project.scripts]
ill-admin-ui = "ill_bridge_ui.admin.main:main"
ill-libris-ui = "ill_bridge_ui.librisportal.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ill_bridge_ui"]
