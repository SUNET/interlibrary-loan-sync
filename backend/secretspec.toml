[project]
name = "ill-bridge"
revision = "1.0"

[providers]
bootstrap = "keyring://"

[providers.passbolt_team]
uri = "passbolt://?server=https://www.passbolt.local:4433&folder=58d07d9f-77a0-4eab-8712-e443a27c1fe6"
# credentials = { private_key = "bootstrap", passphrase = "bootstrap" }

[profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
ILL_DATABASE_URL = { description = "Postgres DATABASE_URL", providers = ["passbolt_team"] }
ILL_LIBRIS_SIGEL = { description = "Libris sigel", default = "Hal", required = false }
ILL_LIBRIS_API_KEY = { description = "Libris apikey", providers = ["passbolt_team"] }
HALMSTAD_LIBRIS_USERNAME = { description = "Halmstad libris user", default = "Hal", required = false }
HALMSTAD_LIBRIS_PASSWORD = { description = "Halmstad libris pass", providers = ["passbolt_team"] }
BTH_LIBRIS_USERNAME = { description = "Halmstad libris user", default = "Bthg", required = false }
BTH_LIBRIS_PASSWORD = { description = "Halmstad libris pass", providers = ["passbolt_team"] }
# Non-secret value that should just use a default
BAN_URL = {
  description = "Public site URL",
  default = "https://www.ban.com",
  required = false          # optional, but recommended for defaults
}
