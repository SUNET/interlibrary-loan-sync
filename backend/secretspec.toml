[project]
name = "ill-bridge"
revision = "1.0"

[providers]
bootstrap = "keyring://"

[providers.passbolt_team]
uri = "passbolt://?server=https://www.passbolt.local:4433&folder=58d07d9f-77a0-4eab-8712-e443a27c1fe6"
# credentials = { private_key = "bootstrap", passphrase = "bootstrap" }

[profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
ILL_DATABASE_PASSWORD = { description = "Postgres DATABASE_URL", providers = ["passbolt_team"] }
ILL_DATABASE_URL = {
  description = "Postgres URL (app / SQLAlchemy)",
  composed = "postgresql://admin:${ILL_DATABASE_PASSWORD}@localhost:5432/ill",
  required = false,
}
ILL_DATABASE_URL_PSYCOPG = {
  description = "Postgres URL for yoyo (psycopg3)",
  composed = "postgresql+psycopg://admin:${ILL_DATABASE_PASSWORD}@localhost:5432/ill",
  required = false,
}
ILL_LIBRIS_SIGEL = { description = "Libris sigel", default = "Hal", required = false }
ILL_LIBRIS_API_KEY = { description = "Libris apikey", providers = ["passbolt_team"] }
HALMSTAD_LIBRIS_USERNAME = { description = "Halmstad libris user", default = "Hal", required = false }
HALMSTAD_LIBRIS_PASSWORD = { description = "Halmstad libris pass", providers = ["passbolt_team"] }
HH_LIBRIS_USERNAME = { description = "Halmstad libris user", default = "Hal", required = false }
HH_LIBRIS_PASSWORD = { description = "Halmstad libris pass", providers = ["passbolt_team"] }
BTH_LIBRIS_USERNAME = { description = "BTH libris user", default = "Bthg", required = false }
BTH_LIBRIS_PASSWORD = { description = "BTH libris pass", providers = ["passbolt_team"] }
MDU_LIBRIS_USERNAME = { description = "MDU libris user", default = "Mde", required = false }
MDU_LIBRIS_PASSWORD = { description = "MDU libris pass", providers = ["passbolt_team"] }
# Folio
ILL_ENVIRONMENT = { description = "Runtime Environment", default = "test", required = false }
ILL_TENANT_NAME = { description = "Tenant name", default = "bth", required = false }
ILL_FOLIO_TENANT = { description = "Folio tenant name", default = "bth", required = false }
ILL_FOLIO_TENANT_SECRET = { description = "Folio tenant secret", providers = ["passbolt_team"] }
ILL_FOLIO_TENANT_USERNAME = { description = "Folio tenant username", default = "sidecar-module-access-client", required = false }
# Database configurations (if managing them via SecretSpec/Environment)
PYWAY_DATABASE_PASSWORD = {
  description = "Password for pyway (alias)",
  composed = "${ILL_DATABASE_PASSWORD}",
  required = false,
}
# Non-secret config with defaults is fine as you have it
PYWAY_TYPE = { description = "Database type", default = "postgres", required = false }
PYWAY_DATABASE_USERNAME = { description = "Database username", default = "admin", required = false }
PYWAY_DATABASE_HOST = { description = "Database host", default = "localhost", required = false }
PYWAY_DATABASE_PORT = { description = "Database port", default = "5432", required = false }
PYWAY_DATABASE_NAME = { description = "Database name", default = "ill", required = false }
PYWAY_DATABASE_MIGRATION_DIR = { description = "Migrations directory", default = "migrations", required = false }
PYWAY_TABLE = { description = "Pyway history table", default = "public.pyway", required = false }
