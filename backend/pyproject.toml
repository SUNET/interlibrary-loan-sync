[project]
name = "ill-bridge"
version = "0.1.0"
description = "Provider-agnostic ILL (fjärrlån) integration service between FOLIO and Libris"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler==3.11.3",
    "faker==40.38.0",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "procrastinate[asyncpg]==3.9.0",
    "psycopg[binary]==3.3.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: the package sits at the project root, so it is importable
# from the working tree without an install step. Explicit rather than
# relying on hatchling's name-based auto-detection.
[tool.hatch.build.targets.wheel]
packages = ["ill_bridge"]

[tool.uv]
dev-dependencies = [
    "faker==40.38.0",
    "pytest>=9.1.1",
]
