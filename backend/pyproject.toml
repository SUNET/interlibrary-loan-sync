[project]
name = "ill-bridge"
version = "0.2.5"
description = "Provider-agnostic ILL (fjärrlån) integration service between FOLIO and Libris"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler==3.11.3",
    "asyncpg>=0.31.0",
    "faker==40.38.0",
    "fastapi==0.162.0",
    "httpx2==2.12.0",
    "procrastinate[asyncpg]==3.9.0",
    "psycopg[binary]==3.3.5",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.8.0",
    "pyway==0.3.33",
    "rich==15.0.0",
    "sqlacodegen==4.0.4",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: the package sits at the project root, so it is importable
# from the working tree without an install step. Explicit rather than
# relying on hatchling's name-based auto-detection.
[tool.hatch.build.targets.wheel]
packages = ["ill_bridge"]

[tool.uv]
# uv add --dev testcontainers[postgres]==4.15.0 mutmut==3.8.1 nox==2026.10.20 hypothesis==6.170.14 ruff==0.17.3 pytest-cov==7.1.0
dev-dependencies = [
    "faker==40.38.0",
    "hypothesis==6.170.14",
    "mutmut==3.8.1",
    "nox==2026.10.20",
    "pytest>=9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
]
