# docker compose -f docker-compose-test.yml up -d
# docker compose -f docker-compose-test.yml up db migrate -d

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: ill-keycloak
    command: start-dev
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}

  db:
    image: postgres:18.6
    container_name: ill-db
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-ill}
      # Use ICU provider for robust cross-platform Swedish sorting (åäö)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=sv-SE"
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  migrate:
    image: ghcr.io/sunet/ill-bridge-backend:0.2.6
    container_name: ill-migrate
    logging: *default-logging
    command: python -m ill_bridge.jobs.migrate
    environment: &backend_env
      PYTHONPATH: /app
      ILL_LIBRIS_SIGEL: ${ILL_LIBRIS_SIGEL:-Hal}
      ILL_LIBRIS_API_KEY: ${ILL_LIBRIS_API_KEY}
      ILL_LIBRIS_BASE_URL: http://fake-provider:9000/librisfjarrlan/api
      ILL_DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ill}
      ILL_ENVIRONMENT: ${ILL_ENVIRONMENT}
      ILL_API_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-45.0}
      POLL_LOOKBACK_DAYS: ${POLL_LOOKBACK_DAYS:-1}
      # SMTP settings
      ILL_SMTP_HOST: ${ILL_SMTP_HOST:-smtp.sunet.se}
      ILL_SMTP_PORT: ${ILL_SMTP_PORT:-587}
      ILL_SMTP_USERNAME: ${ILL_SMTP_USERNAME:-folio-test}
      ILL_SMTP_SECRET: ${ILL_SMTP_SECRET}
      # Keycloak settings 
      # TODO: KEyckia varies per tenants check. docs/API_TENANT_FOLIO_AND_KEYCLOAK_CONFIGS.md
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ill-bridge}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-master}
      KEYCLOAK_ADMIN_LOGIN_METHOD: ${KEYCLOAK_ADMIN_LOGIN_METHOD:-user}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-ill-bridge-provisioner}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      # FOLIO settings
      ILL_FOLIO_SECRET_BTH: ${ILL_FOLIO_SECRET_BTH}
      ILL_FOLIO_SECRET_HH: ${ILL_FOLIO_SECRET_HH}
      ILL_FOLIO_SECRET_MDU: ${ILL_FOLIO_SECRET_MDU}
      ILL_FOLIO_USERNAME_BTH: ${ILL_FOLIO_USERNAME_BTH:-sidecar-module-access-client}
      ILL_FOLIO_REALM_BTH: ${ILL_FOLIO_REALM_BTH:-bth}
      ILL_FOLIO_TENANT_BTH: ${ILL_FOLIO_TENANT_BTH:-bth}
      ILL_FOLIO_USERNAME_HH: ${ILL_FOLIO_USERNAME_HH:-sidecar-module-access-client}
      ILL_FOLIO_REALM_HH: ${ILL_FOLIO_REALM_HH:-diku}
      ILL_FOLIO_TENANT_HH: ${ILL_FOLIO_TENANT_HH:-diku}
      ILL_FOLIO_USERNAME_MDU: ${ILL_FOLIO_USERNAME_MDU:-sidecar-module-access-client}
      ILL_FOLIO_REALM_MDU: ${ILL_FOLIO_REALM_MDU:-diku}
      ILL_FOLIO_TENANT_MDU: ${ILL_FOLIO_TENANT_MDU:-diku}
      # Pyway migration settings
      PYWAY_TYPE: postgres
      PYWAY_DATABASE_HOST: db
      PYWAY_DATABASE_PORT: 5432
      PYWAY_DATABASE_NAME: ${POSTGRES_DB:-ill}
      PYWAY_DATABASE_USERNAME: ${POSTGRES_USER:-admin}
      PYWAY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PYWAY_DATABASE_MIGRATION_DIR: /app/migrations
      PYWAY_TABLE: public.pyway
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/sunet/ill-bridge-backend:0.2.6
    container_name: ill-api
    logging: *default-logging
    command: uvicorn --factory ill_bridge.api.main:create_app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend_env
      ILL_API_ADMIN_USERNAME: ${API_ADMIN_USERNAME:-admin}
      ILL_API_ADMIN_PASSWORD_HASHED: ${API_ADMIN_PASSWORD_HASHED}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin-ui:
    image: ghcr.io/sunet/ill-bridge-ui:0.2.6
    container_name: ill-admin-ui
    logging: *default-logging
    environment:
      ILL_UI_ADMIN_API_BASE: http://api:8000/api/v1
      ILL_UI_ENVIRONMENT: local
      ILL_UI_API_ADMIN_USERNAME: ${API_ADMIN_USERNAME:-admin}
      ILL_UI_API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD}
    ports: ["8080:8080"]
    volumes:
      - ../ui/ill_bridge_ui:/app/ill_bridge_ui
    depends_on:
      api:
        condition: service_started

  procrastinate-tasks:
    image: ghcr.io/sunet/ill-bridge-backend:0.2.6
    container_name: ill-procrastinate-tasks
    logging: *default-logging
    command: >
      procrastinate --app=ill_bridge.jobs.bootstrap.app worker --queues=provider,test --concurrency=4
    environment:
      <<: *backend_env
      BTH_LIBRIS_PASSWORD: ${BTH_LIBRIS_PASSWORD}
      HH_LIBRIS_PASSWORD: ${HH_LIBRIS_PASSWORD}
      MDU_LIBRIS_PASSWORD: ${MDU_LIBRIS_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    image: ghcr.io/sunet/ill-bridge-backend:0.2.6
    container_name: ill-scheduler
    logging: *default-logging
    command: python -m ill_bridge.jobs.scheduler
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Handled via Procrastinate (scheduler + procrastinate-tasks)
  # effect-dispatcher:
  #   image: ghcr.io/sunet/ill-bridge-backend:0.2.6
  #   logging: *default-logging
  #   command: python -m ill_bridge.jobs.dispatch_effects
  #   environment: *backend_env
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
